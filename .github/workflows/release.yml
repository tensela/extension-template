# When a version is tagged (git tag v0.2.0 && git push --tags): the tests, then the .zip and its SHA-256 attached to a
# release of the repository. The catalogue of tensela.com asks for both (see README.md, «Publish it»).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tensela, to test and pack with it
        run: pip install "tensela @ git+https://github.com/tensela/tensela" pytest
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests -q
      - name: Pack
        run: |
          mkdir dist
          python -m tensela.ui.launch --pack-extension . dist | tee dist/pack.txt
          cd dist && sha256sum *.zip > SHA256SUMS
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
